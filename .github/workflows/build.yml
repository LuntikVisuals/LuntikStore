name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Decode signing key from secrets
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > keystore/luntik.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ключ подписи взят из GitHub Secrets"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты KEYSTORE_BASE64/KEYSTORE_PASSWORD не заданы — сборка будет подписана тестовым debug-ключом, релиз НЕ публикуется (иначе обновления не встанут поверх)."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Build Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi
          rm -f keystore/luntik.keystore

      - name: Check signature matches installed LuntikStore
        if: steps.sign.outputs.signed == 'true'
        run: |
          EXPECTED="422cfbbb0a90462cae86dc35a0f8eb3b6e846c4100ec137c27a8ea08483b16d2"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          GOT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "cert: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then echo "::error::Подпись не совпадает с установленным LuntikStore — релиз отменён"; exit 1; fi

      - name: Prepare APK for release
        if: success()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/LuntikStore.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: luntikstore-debug-apk
          path: release/LuntikStore.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && steps.sign.outputs.signed == 'true'
        with:
          tag_name: latest
          name: LuntikStore latest
          body: |
            Автосборка LuntikStore (фиксированная подпись — обновления ставятся поверх)
          files: release/LuntikStore.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
